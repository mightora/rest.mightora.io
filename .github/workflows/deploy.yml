name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source tests
        run: npm test
      - name: Obtain official Mightora logo for offline builds
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            'https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png' \
            --output assets/mightora-logo.png
          for file in TechTweedie_bw.png tweedTechnologyLogoLight.png; do
            curl --fail --location --show-error --silent --retry 3 \
              "https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/$file" \
              --output "assets/$file"
          done
          # Bundle the official shared UI at build time for offline use.
          for file in shared.css components.js footer.yaml ian-tweedie-presenting-4.png ian-tweedie-sq2.png main-logo.png; do
            curl --fail --location --show-error --silent --retry 3 \
              "https://raw.githubusercontent.com/mightora/shared-ui/main/$file" \
              --output "assets/$file"
          done
          curl --fail --location --show-error --silent --retry 3 \
            'https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js' \
            --output assets/js-yaml.min.js
      - name: Build online and offline editions
        env:
          REQUIRE_OFFICIAL_LOGO: '1'
        run: npm run build
      - name: Test releases and offline isolation
        env:
          REQUIRE_OFFICIAL_LOGO: '1'
        run: npm run test:build
      - name: Browser smoke test (hosted and offline)
        run: python3 scripts/browser_smoke.py
      - name: Upload Dataverse web resource package
        uses: actions/upload-artifact@v4
        with:
          name: mightora-rest-dataverse
          path: |
            dist/dataverse/rest.html
            dist/downloads/rest-Dataverse.zip
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: dist
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Upload offline downloads
        uses: actions/upload-artifact@v4
        with:
          name: mightora-rest-studio-offline
          path: |
            dist/downloads/rest-studio-offline.html
            dist/downloads/mightora-rest-studio-offline.zip
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
