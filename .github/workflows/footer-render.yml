name: Footer rendering verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/footer-render.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footer-dom:
    runs-on: ubuntu-latest
    steps:
      - name: Check rendered desktop and offline DOM
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then
            echo "Chromium/Chrome unavailable on this runner" >&2
            exit 1
          fi
          echo "Chrome binary: $chrome"
          curl --fail --location --show-error --silent --retry 3 \
            https://rest.mightora.io/downloads/rest-studio-offline.html \
            -o /tmp/rest-studio-offline.html
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=9000 \
            --dump-dom https://rest.mightora.io/ \
            > /tmp/rest-live-dom.html 2>/tmp/rest-live-chrome.log
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --allow-file-access-from-files \
            --virtual-time-budget=9000 \
            --dump-dom file:///tmp/rest-studio-offline.html \
            > /tmp/rest-offline-dom.html 2>/tmp/rest-offline-chrome.log
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class FooterInspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_footer=False
                  self.cols=0
                  self.brands=0
                  self.headings=[]
                  self.heading=False
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='mightora-footer':self.in_footer=True
                  if not self.in_footer:return
                  a=dict(attrs)
                  classes=set(a.get('class','').split())
                  if tag=='div' and 'footer-col' in classes:self.cols+=1
                  if tag=='a' and 'footer-brand' in classes:self.brands+=1
                  if tag=='div' and 'footer-section-title' in classes:self.heading=True
                  if tag=='a':self.links.append(a.get('href',''))
              def handle_data(self,data):
                  if self.heading and data.strip():self.headings.append(data.strip())
              def handle_endtag(self,tag):
                  if tag=='div':self.heading=False
                  if tag=='mightora-footer':self.in_footer=False
          for mode,filename in [('live','/tmp/rest-live-dom.html'),('offline','/tmp/rest-offline-dom.html')]:
              text=Path(filename).read_text()
              dom=FooterInspector()
              dom.feed(text)
              author=text.index('<mightora-author')
              footer=text.index('<mightora-footer')
              evidence=text.index('id="evidence"')
              print(f'{mode}: columns={dom.cols}, brand links={dom.brands}, headings={dom.headings}')
              assert dom.cols==3, f'{mode}: expected 3 shared footer columns'
              assert dom.brands>=3, f'{mode}: expected shared brand card links'
              assert evidence<author<footer, f'{mode}: author must precede footer'
              assert 'https://mightora.io/about/' in dom.links, f'{mode}: corporate link must go to Mightora.io'
              if mode=='offline':
                  assert "connect-src 'none'" in text, 'offline should block network connections'
                  assert 'data:image/png;base64' in text, 'offline brand imagery must be embedded'
          print('PASS: live and offline Mightora footer render all shared columns, brands, and correct ordering')
          PY
          echo "### Footer rendering verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Live and offline footer navigation, brand cards, and layout ordering verified." >> "$GITHUB_STEP_SUMMARY"
